<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Shopping Cart</title><style>body{font-family:Arial;margin:30px;background:#f7f7f7}.cart{background:white;padding:25px;max-width:700px;margin:auto}.cart-item{padding:12px;border-bottom:1px solid #ddd}#cartTotal{font-size:24px;font-weight:bold;margin-top:20px}</style></head><body><div class="cart"><h1>Shopping Cart</h1><div id="cartItems"></div><div id="cartTotal">$0.00</div><button id="backToSearchBtn">Back to Search</button></div><script>function getCart(){return JSON.parse(localStorage.getItem('cart')||'[]')}function render(){const c=getCart(),box=document.getElementById('cartItems');let total=0;box.innerHTML='';c.forEach((x,i)=>{total+=Number(x.price);const d=document.createElement('div');d.className='cart-item';d.innerText=`${i+1}. ${x.name} - $${Number(x.price).toFixed(2)}`;box.appendChild(d)});document.getElementById('cartTotal').innerText=`$${total.toFixed(2)}`}document.getElementById('backToSearchBtn').onclick=()=>location.href='mock_ebay.html';render();</script></body></html>
