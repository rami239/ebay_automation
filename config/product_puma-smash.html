<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Puma Smash Casual Shoes</title></head><body><h1>Puma Smash Casual Shoes</h1><p>Price: $85.00</p><label>Size: <select id="variant-size"><option value="40">40</option><option value="41">41</option><option value="42">42</option></select></label><label>Color: <select id="variant-color"><option value="White">White</option><option value="Black">Black</option></select></label><button id="addToCartBtn">Add to cart</button><button id="backToSearchBtn">Back to Search</button><span id="cartCount">0</span><script>const product={id:"puma-smash",name:"Puma Smash Casual Shoes",price:85};function getCart(){return JSON.parse(localStorage.getItem('cart')||'[]')}function setCart(c){localStorage.setItem('cart',JSON.stringify(c));document.getElementById('cartCount').innerText=c.length}document.getElementById('addToCartBtn').onclick=()=>{const c=getCart();c.push(product);setCart(c)};document.getElementById('backToSearchBtn').onclick=()=>location.href='mock_ebay.html';setCart(getCart());</script></body></html>
