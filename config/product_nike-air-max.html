<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Nike Air Max Running Shoes Black</title></head><body><h1>Nike Air Max Running Shoes Black</h1><p>Price: $150.00</p><label>Size: <select id="variant-size"><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option></select></label><label>Color: <select id="variant-color"><option value="Black">Black</option><option value="White">White</option></select></label><button id="addToCartBtn">Add to cart</button><button id="backToSearchBtn">Back to Search</button><span id="cartCount">0</span><script>const product={id:"nike-air-max",name:"Nike Air Max Running Shoes Black",price:150};function getCart(){return JSON.parse(localStorage.getItem('cart')||'[]')}function setCart(c){localStorage.setItem('cart',JSON.stringify(c));document.getElementById('cartCount').innerText=c.length}document.getElementById('addToCartBtn').onclick=()=>{const c=getCart();c.push(product);setCart(c)};document.getElementById('backToSearchBtn').onclick=()=>location.href='mock_ebay.html';setCart(getCart());</script></body></html>
