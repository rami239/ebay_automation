<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>New Balance Fresh Foam Shoes</title></head><body><h1>New Balance Fresh Foam Shoes</h1><p>Price: $210.00</p><label>Size: <select id="variant-size"><option value="41">41</option><option value="42">42</option><option value="43">43</option></select></label><label>Color: <select id="variant-color"><option value="Gray">Gray</option><option value="Black">Black</option></select></label><button id="addToCartBtn">Add to cart</button><button id="backToSearchBtn">Back to Search</button><span id="cartCount">0</span><script>const product={id:"new-balance",name:"New Balance Fresh Foam Shoes",price:210};function getCart(){return JSON.parse(localStorage.getItem('cart')||'[]')}function setCart(c){localStorage.setItem('cart',JSON.stringify(c));document.getElementById('cartCount').innerText=c.length}document.getElementById('addToCartBtn').onclick=()=>{const c=getCart();c.push(product);setCart(c)};document.getElementById('backToSearchBtn').onclick=()=>location.href='mock_ebay.html';setCart(getCart());</script></body></html>
